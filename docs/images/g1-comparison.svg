<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="650" viewBox="0 0 1120 650"><style>text{font-family:Arial,'Noto Sans CJK SC',sans-serif;fill:#263238}.title{font-size:24px;font-weight:bold}.sub{font-size:14px;fill:#546e7a}.label{font-size:15px;font-weight:bold}.small{font-size:13px;fill:#455a64}.grid{stroke:#e1e7ea;stroke-width:1}.axis{stroke:#90a4ae}.p{fill:#fafcfd;stroke:#dce3e7}.c1{fill:#4f9ed8}.c2{fill:#44a08d}.c3{fill:#9974c7}.c4{fill:#ef9c42}</style>
<text x="45" y="38" class="title">G1 rosbag 负载：1/2/3 Hz 短测与 1 Hz 60 分钟长测</text><text x="45" y="64" class="sub">板载：NVIDIA Orin NX Developer Kit · rosbag CPU 为单核百分比，RSS 为常驻内存</text>
<rect x="35" y="86" width="510" height="242" rx="8" class="p"/><text x="55" y="115" class="label">估算写盘量（GiB/h）</text>
<g class="grid"><line x1="170" y1="142" x2="170" y2="295"/><line x1="250" y1="142" x2="250" y2="295"/><line x1="330" y1="142" x2="330" y2="295"/><line x1="410" y1="142" x2="410" y2="295"/><line x1="490" y1="142" x2="490" y2="295"/></g><line x1="170" y1="295" x2="490" y2="295" class="axis"/><text x="166" y="315" class="small">0</text><text x="246" y="315" class="small">1.5</text><text x="326" y="315" class="small">3</text><text x="406" y="315" class="small">4.5</text><text x="486" y="315" class="small">6</text>
<text x="55" y="157" class="small">1 Hz</text><rect x="170" y="141" width="102" height="20" class="c1"/><text x="278" y="156" class="small">1.92</text><text x="55" y="195" class="small">2 Hz</text><rect x="170" y="179" width="196" height="20" class="c2"/><text x="372" y="194" class="small">3.67</text><text x="55" y="233" class="small">3 Hz</text><rect x="170" y="217" width="290" height="20" class="c3"/><text x="466" y="232" class="small">5.43</text><text x="55" y="271" class="small">60 min</text><rect x="170" y="255" width="108" height="20" class="c4"/><text x="284" y="270" class="small">≈2.02</text>
<rect x="575" y="86" width="510" height="242" rx="8" class="p"/><text x="595" y="115" class="label">rosbag recorder CPU（% of one core）</text><g class="grid"><line x1="730" y1="142" x2="730" y2="295"/><line x1="800" y1="142" x2="800" y2="295"/><line x1="870" y1="142" x2="870" y2="295"/><line x1="940" y1="142" x2="940" y2="295"/><line x1="1010" y1="142" x2="1010" y2="295"/></g><line x1="730" y1="295" x2="1010" y2="295" class="axis"/><text x="726" y="315" class="small">0</text><text x="796" y="315" class="small">1</text><text x="866" y="315" class="small">2</text><text x="936" y="315" class="small">3</text><text x="1006" y="315" class="small">4</text>
<text x="595" y="157" class="small">1 Hz</text><rect x="730" y="141" width="150" height="20" class="c1"/><text x="886" y="156" class="small">2.14%</text><text x="595" y="195" class="small">2 Hz</text><rect x="730" y="179" width="196" height="20" class="c2"/><text x="932" y="194" class="small">2.80%</text><text x="595" y="233" class="small">3 Hz</text><rect x="730" y="217" width="202" height="20" class="c3"/><text x="938" y="232" class="small">2.89%</text><text x="595" y="271" class="small">60 min</text><rect x="730" y="255" width="241" height="20" class="c4"/><text x="977" y="270" class="small">3.2–3.7%</text>
<rect x="35" y="355" width="510" height="230" rx="8" class="p"/><text x="55" y="384" class="label">rosbag RSS（MiB）</text><line x1="170" y1="550" x2="490" y2="550" class="axis"/><g class="grid"><line x1="170" y1="414" x2="170" y2="550"/><line x1="276.7" y1="414" x2="276.7" y2="550"/><line x1="383.3" y1="414" x2="383.3" y2="550"/><line x1="490" y1="414" x2="490" y2="550"/></g><text x="166" y="570" class="small">0</text><text x="270" y="570" class="small">20</text><text x="376" y="570" class="small">40</text><text x="484" y="570" class="small">60</text><text x="55" y="431" class="small">1 / 2 / 3 Hz</text><rect x="170" y="415" width="214" height="23" class="c1"/><text x="390" y="432" class="small">40.1–40.4</text><text x="55" y="475" class="small">60 min</text><rect x="170" y="459" width="228" height="23" class="c4"/><text x="404" y="476" class="small">≈42–43</text><text x="55" y="530" class="sub">adapter RSS：历史 29.4–30.5 MiB；长测约 30–34 MiB</text>
<rect x="575" y="355" width="510" height="230" rx="8" class="p"/><text x="595" y="384" class="label">adapter CPU（% of one core）</text><line x1="730" y1="550" x2="1010" y2="550" class="axis"/><g class="grid"><line x1="730" y1="414" x2="730" y2="550"/><line x1="786" y1="414" x2="786" y2="550"/><line x1="842" y1="414" x2="842" y2="550"/><line x1="898" y1="414" x2="898" y2="550"/><line x1="954" y1="414" x2="954" y2="550"/><line x1="1010" y1="414" x2="1010" y2="550"/></g><text x="726" y="570" class="small">0</text><text x="782" y="570" class="small">3</text><text x="838" y="570" class="small">6</text><text x="894" y="570" class="small">9</text><text x="946" y="570" class="small">12</text><text x="1003" y="570" class="small">15</text><text x="595" y="431" class="small">1 / 2 / 3 Hz</text><rect x="730" y="415" width="220" height="23" class="c2"/><text x="956" y="432" class="small">11.8–12.0</text><text x="595" y="475" class="small">60 min</text><rect x="730" y="459" width="240" height="23" class="c4"/><text x="976" y="476" class="small">12.7–13.0</text><text x="45" y="625" class="sub">对比限制：历史短测与 CLI 长测不是完全相同的 recorder 版本/工况；整机 CPU 受其他服务影响，见报告表格。</text></svg>